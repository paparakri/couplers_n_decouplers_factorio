[docking-message]
prefix=[Docking Port]
dock-started=Docking sequence initiated.
dock-cancelled=Docking cancelled.
dock-failed=Docking failed:
docked=__1__ and __2__ are docked (__3__ entities moved).
undocked=__1__ has undocked.
undock-pending=Undocking as soon as the host stops.
undock-failed=Undocking failed: only __1__ of __2__ entities could be restored. The platforms stay docked.
guest-lost=The guest platform no longer exists; its docked content now belongs to the host.
clone-mismatch=only __1__ of __2__ entities could be copied. Nothing was changed.
overlap=the guest platform would overlap the host here. Use ports with more open space around them.
ports-not-facing=the two ports must face each other.
bad-direction=the port has an unsupported direction.
platform-missing=a platform no longer exists.
port-missing=a docking port no longer exists.
platform-deleting=__1__ is being deleted.
platform-in-transit=__1__ is in transit.
platform-already-docked=__1__ is already docked.
same-platform=both ports are on the same platform.
different-locations=the platforms are at different locations.
different-forces=the platforms belong to different forces.
