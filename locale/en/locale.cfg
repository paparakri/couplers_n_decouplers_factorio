docking-corridor-width=Default corridor width

[mod-setting-description]
docking-transfer-rate=Items per tick moved between the two hubs to fill their logistic requests.
docking-animation-ticks=How many ticks the docking countdown lasts before the platforms join.
allow-moving-while-docked=If enabled, the larger (host) platform can fly while docked and carries the smaller one with it. If disabled, the host is paused while docked.
docking-corridor-length=Default walkway length between the two ports. Can be changed per dock in the port window.
docking-corridor-width=Default walkway width. Can be changed per dock in the port window.

